<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
    name="theme-color"
    content="#111111"
>

<title>Neo Morse 0.6</title>


<style>

/* ==================================================
   ОСНОВА
================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #eef0f2;

    color: #111;

    min-height: 100vh;
}


.app {

    width: 100%;

    max-width: 720px;

    margin: 0 auto;

    padding:
        18px 14px 35px;
}


/* ==================================================
   HEADER
================================================== */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;
}

.logo {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    background: #111;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: bold;

    font-size: 18px;
}

h1 {

    margin: 0;

    font-size: 25px;
}

.version {

    font-size: 12px;

    color: #777;

    margin-top: 3px;
}

.status-light {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #bbb;
}

.status-light.active {

    background: #111;
}


/* ==================================================
   CARD
================================================== */

.card {

    background: white;

    border:
        1px solid #dedede;

    border-radius: 18px;

    padding: 17px;

    margin-bottom: 13px;

    box-shadow:
        0 3px 12px rgba(
            0,
            0,
            0,
            0.04
        );
}


.label {

    font-size: 13px;

    font-weight: bold;

    color: #666;

    margin-bottom: 9px;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}


/* ==================================================
   SELECT
================================================== */

select {

    width: 100%;

    border:
        1px solid #ccc;

    border-radius: 12px;

    padding: 13px;

    font-size: 16px;

    background: #fff;

    color: #111;

    outline: none;
}


/* ==================================================
   MODE BUTTONS
================================================== */

.mode-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

button {

    border:
        1px solid #ccc;

    border-radius: 12px;

    background: white;

    color: #111;

    padding: 12px 14px;

    font-size: 15px;

    cursor: pointer;

    transition:
        0.15s ease;

    -webkit-tap-highlight-color:
        transparent;
}

button:active {

    transform:
        scale(0.98);
}

button:hover {

    background: #f0f0f0;
}

button.active {

    background: #111;

    color: white;

    border-color: #111;
}


/* ==================================================
   TEXTAREA
================================================== */

textarea {

    width: 100%;

    min-height: 145px;

    resize: vertical;

    border:
        1px solid #ccc;

    border-radius: 14px;

    padding: 14px;

    font-size: 18px;

    line-height: 1.45;

    outline: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

textarea:focus {

    border-color: #777;
}


/* ==================================================
   ACTIONS
================================================== */

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 9px;
}

.primary {

    background: #111;

    color: white;

    border-color: #111;
}

.primary:hover {

    background: #222;
}


/* ==================================================
   RESULT
================================================== */

.result {

    min-height: 90px;

    background:
        #f0f1f2;

    border-radius: 14px;

    padding: 15px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 20px;

    line-height: 1.5;

    word-break: break-word;

    white-space: pre-wrap;
}

.result.morse {

    font-family:
        "Courier New",
        monospace;

    letter-spacing: 2px;
}


/* ==================================================
   RADIO BUTTON
================================================== */

.radio-control {

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 8px 0 4px;
}

.play-button {

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background: #111;

    color: white;

    border: 7px solid #ddd;

    font-size: 17px;

    font-weight: bold;

    display: flex;

    justify-content: center;

    align-items: center;

    margin: 8px 0 12px;

    box-shadow:
        0 5px 18px
        rgba(
            0,
            0,
            0,
            0.15
        );
}

.play-button:hover {

    background: #222;
}

.play-button.playing {

    background: #444;

    border-color: #aaa;
}

.play-status {

    font-size: 13px;

    color: #777;

    text-align: center;
}


/* ==================================================
   SETTINGS
================================================== */

.setting {

    margin-bottom: 18px;
}

.setting:last-child {

    margin-bottom: 0;
}

.setting-title {

    display: flex;

    justify-content: space-between;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 8px;
}

.setting-value {

    color: #777;

    font-weight: normal;
}

input[type="range"] {

    width: 100%;

    accent-color: #111;

    cursor: pointer;
}


/* ==================================================
   TABLE
================================================== */

.table-wrapper {

    overflow-x: auto;

    border-radius: 12px;

    border:
        1px solid #ddd;
}

.morse-table {

    width: 100%;

    border-collapse:
        collapse;

    background: white;
}

.morse-table th,
.morse-table td {

    padding: 10px;

    border-bottom:
        1px solid #ddd;

    text-align: center;
}

.morse-table th {

    background:
        #f0f0f0;

    font-size: 13px;
}

.morse-table td {

    font-size: 15px;
}

.morse-code {

    font-family:
        "Courier New",
        monospace;

    font-size: 17px !important;

    letter-spacing: 2px;
}


/* ==================================================
   STATUS
================================================== */

#status {

    min-height: 18px;

    margin-top: 9px;

    text-align: center;

    color: #666;

    font-size: 13px;
}


/* ==================================================
   FOOTER
================================================== */

.footer {

    text-align: center;

    color: #888;

    font-size: 12px;

    padding-top: 4px;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 520px) {

    .app {

        padding:
            12px 10px 28px;
    }

    .card {

        border-radius: 16px;

        padding: 14px;
    }

    h1 {

        font-size: 23px;
    }

    textarea {

        min-height: 125px;

        font-size: 17px;
    }

    .result {

        font-size: 18px;
    }

    .play-button {

        width: 115px;
        height: 115px;
    }

}


/* ==================================================
   VERY SMALL SCREENS
================================================== */

@media (max-width: 360px) {

    .mode-buttons,
    .actions {

        grid-template-columns:
            1fr;
    }

    .play-button {

        width: 105px;
        height: 105px;
    }
}

</style>

</head>

<!-- ==================================================

    <div class="actions">

        <button

            Очистить
        </button>

    </div>

</div>


<!-- ==================================================
     RESULT
================================================== -->

<div class="card">

    <div

    >

    </div>

    <div
        id="result"
        class="result morse"

        Здесь появится результат
    </div>

    <div class="actions">

        <button id="copyButton">
            Копировать
        </button>

        <button
            id="useResultButton"
        >
            Использовать
        </button>

    </div>

</div>


<!-- ==================================================
     RADIO / AUDIO
================================================== -->

<div class="card">

    <div class="label">
        Морзе-радио
    </div>

    <div class="radio-control">

        <button
            id="playButton"
            class="play-button"
        >
            ▶
        </button>

        <div
            id="playStatus"
            class="play-status"
        >
            Готово к передаче
        </div>

    </div>

</div>


<!-- ==================================================
     SOUND SETTINGS
================================================== -->

<div class="card">

    <div class="label">
        Настройки передачи
    </div>


    <div class="setting">

        <div class="setting-title">

            <span>
                Скорость
            </span>

            <span
                id="speedValue"
                class="setting-value"
            >
                1×
            </span>

        </div>

        <input
            type="range"
            id="speedRange"
            min="0.25"
            max="3"
            step="0.25"
            value="1"
        >

    </div>


    <div class="setting">

        <div class="setting-title">

            <span>
                Тональность
            </span>

            <span
                id="pitchValue"
                class="setting-value"
            >
                650 Гц
            </span>

        </div>

        <input
            type="range"
            id="pitchRange"
            min="300"
            max="1200"
            step="50"
            value="650"
        >

    </div>

</div>


<!-- ==================================================
     MORSE TABLE
================================================== -->

<div class="card">

    <div class="label">
        Таблица Морзе
    </div>

    <div class="table-wrapper">

        <table class="morse-table">

            <thead>

                <tr>

                    <th>

                    </th>

                    <th>
                        Морзе
                    </th>

                </tr>

            </thead>

            <tbody
                id="morseTableBody"
            ></tbody>

        </table>

    </div>

</div>


<div class="footer">
    Neo Morse 0.6 · Open Code
</div>


</div>
