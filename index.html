<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
    name="theme-color"
    content="#111111"
>

<title>Neo Morse 0.6</title>


<style>

/* ==================================================
   ОСНОВА
================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #eef0f2;

    color: #111;

    min-height: 100vh;
}


.app {

    width: 100%;

    max-width: 720px;

    margin: 0 auto;

    padding:
        18px 14px 35px;
}


/* ==================================================
   HEADER
================================================== */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;
}

.logo {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    background: #111;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: bold;

    font-size: 18px;
}

h1 {

    margin: 0;

    font-size: 25px;
}

.version {

    font-size: 12px;

    color: #777;

    margin-top: 3px;
}

.status-light {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #bbb;
}

.status-light.active {

    background: #111;
}


/* ==================================================
   CARD
================================================== */

.card {

    background: white;

    border:
        1px solid #dedede;

    border-radius: 18px;

    padding: 17px;

    margin-bottom: 13px;

    box-shadow:
        0 3px 12px rgba(
            0,
            0,
            0,
            0.04
        );
}


.label {

    font-size: 13px;

    font-weight: bold;

    color: #666;

    margin-bottom: 9px;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}


/* ==================================================
   SELECT
================================================== */

select {

    width: 100%;

    border:
        1px solid #ccc;

    border-radius: 12px;

    padding: 13px;

    font-size: 16px;

    background: #fff;

    color: #111;

    outline: none;
}


/* ==================================================
   MODE BUTTONS
================================================== */

.mode-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

button {

    border:
        1px solid #ccc;

    border-radius: 12px;

    background: white;

    color: #111;

    padding: 12px 14px;

    font-size: 15px;

    cursor: pointer;

    transition:
        0.15s ease;

    -webkit-tap-highlight-color:
        transparent;
}

button:active {

    transform:
        scale(0.98);
}

button:hover {

    background: #f0f0f0;
}

button.active {

    background: #111;

    color: white;

    border-color: #111;
}


/* ==================================================
   TEXTAREA
================================================== */

textarea {

    width: 100%;

    min-height: 145px;

    resize: vertical;

    border:
        1px solid #ccc;

    border-radius: 14px;

    padding: 14px;

    font-size: 18px;

    line-height: 1.45;

    outline: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

textarea:focus {

    border-color: #777;
}


/* ==================================================
   ACTIONS
================================================== */

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 9px;
}

.primary {

    background: #111;

    color: white;

    border-color: #111;
}

.primary:hover {

    background: #222;
}


/* ==================================================
   RESULT
================================================== */

.result {

    min-height: 90px;

    background:
        #f0f1f2;

    border-radius: 14px;

    padding: 15px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 20px;

    line-height: 1.5;

    word-break: break-word;

    white-space: pre-wrap;
}

.result.morse {

    font-family:
        "Courier New",
        monospace;

    letter-spacing: 2px;
}


/* ==================================================
   RADIO BUTTON
================================================== */

.radio-control {

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 8px 0 4px;
}

.play-button {

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background: #111;

    color: white;

    border: 7px solid #ddd;

    font-size: 17px;

    font-weight: bold;

    display: flex;

    justify-content: center;

    align-items: center;

    margin: 8px 0 12px;

    box-shadow:
        0 5px 18px
        rgba(
            0,
            0,
            0,
            0.15
        );
}

.play-button:hover {

    background: #222;
}

.play-button.playing {

    background: #444;

    border-color: #aaa;
}

.play-status {

    font-size: 13px;

    color: #777;

    text-align: center;
}


/* ==================================================
   SETTINGS
================================================== */

.setting {

    margin-bottom: 18px;
}

.setting:last-child {

    margin-bottom: 0;
}

.setting-title {

    display: flex;

    justify-content: space-between;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 8px;
}

.setting-value {

    color: #777;

    font-weight: normal;
}

input[type="range"] {

    width: 100%;

    accent-color: #111;

    cursor: pointer;
}


/* ==================================================
   TABLE
================================================== */

.table-wrapper {

    overflow-x: auto;

    border-radius: 12px;

    border:
        1px solid #ddd;
}

.morse-table {

    width: 100%;

    border-collapse:
        collapse;

    background: white;
}

.morse-table th,
.morse-table td {

    padding: 10px;

    border-bottom:
        1px solid #ddd;

    text-align: center;
}

.morse-table th {

    background:
        #f0f0f0;

    font-size: 13px;
}

.morse-table td {

    font-size: 15px;
}

.morse-code {

    font-family:
        "Courier New",
        monospace;

    font-size: 17px !important;

    letter-spacing: 2px;
}


/* ==================================================
   STATUS
================================================== */

#status {

    min-height: 18px;

    margin-top: 9px;

    text-align: center;

    color: #666;

    font-size: 13px;
}


/* ==================================================
   FOOTER
================================================== */

.footer {

    text-align: center;

    color: #888;

    font-size: 12px;

    padding-top: 4px;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 520px) {

    .app {

        padding:
            12px 10px 28px;
    }

    .card {

        border-radius: 16px;

        padding: 14px;
    }

    h1 {

        font-size: 23px;
    }

    textarea {

        min-height: 125px;

        font-size: 17px;
    }

    .result {

        font-size: 18px;
    }

    .play-button {

        width: 115px;
        height: 115px;
    }

}


/* ==================================================
   VERY SMALL SCREENS
================================================== */

@media (max-width: 360px) {

    .mode-buttons,
    .actions {

        grid-template-columns:
            1fr;
    }

    .play-button {

        width: 105px;
        height: 105px;
    }
}

</style>

</head>

        ...extra

}


const LANGUAGES = {

/* ==================================================
   STATE
================================================== */

let mode = "encode";

let isPlaying = false;

let stopRequested = false;

let audioContext = null;

let oscillator = null;


/* ==================================================
   CURRENT MORSE
================================================== */

function getCurrentMorse() {

    return LANGUAGES[
        languageSelect.value
    ];
}


/* ==================================================
   REVERSE MORSE
================================================== */

function createReverseMorse(morse) {

    const reverse = {};

    for (
        const symbol in morse
    ) {

        const code =
            morse[symbol];

        if (
            reverse[code] === undefined
        ) {

            reverse[code] =
                symbol;
        }
    }

    return reverse;
}


/* ==================================================
   TEXT → MORSE
================================================== */

function textToMorse(text) {

    const morse =
        getCurrentMorse();

    text =
        text.toUpperCase();

    const output = [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character === " "
        ) {

            output.push("/");

            continue;
        }


        if (
            morse[character]
        ) {

            output.push(
                morse[character]
            );
        }
    }


    return output.join(" ");
}


/* ==================================================
   MORSE → TEXT
================================================== */

function morseToText(text) {

    const reverse =
        createReverseMorse(
            getCurrentMorse()
        );

    text =
        text.trim();


    if (!text) {

        return "";
    }


    const words =
        text.split("/");

    const output = [];


    for (
        let w = 0;
        w < words.length;
        w++
    ) {

        const word =
            words[w].trim();


        if (!word) {

            continue;
        }


        const letters =
            word.split(/\s+/);

        let decoded = "";


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            const code =
                letters[i];


            if (
                reverse[code]
            ) {

                decoded +=
                    reverse[code];

            } else {

                decoded += "?";
            }
        }


        output.push(
            decoded
        );
    }


    return output.join(" ");
}

================================================== */

function translate() {

    stopPlayback();

    const text =
        input.value;


    if (
        text.trim() === ""
    ) {

        result.textContent =
            "Здесь появится результат";

        status.textContent = "";

        return;
    }


    if (
        mode === "encode"
    ) {

        result.textContent =
            textToMorse(text);

        result.classList.add(
            "morse"
        );

        resultLabel.textContent =
            "Азбука Морзе";

    } else {

        result.textContent =
            morseToText(text);

        result.classList.remove(
            "morse"
        );

        resultLabel.textContent =
            "Текст";
    }


    status.textContent =
        "Готово";
}

            const row =
                document.createElement(

            const symbolCell =
                document.createElement(

                );

            const codeCell =

                symbol;

            codeCell.textContent =

                "morse-code";

            row.appendChild(
                symbolCell
            );

            row.appendChild(
                codeCell
            );

            tableBody.appendChild(
                row
            );
        }
    );
}

/* ==================================================
   AUDIO CONTEXT
================================================== */

function createAudio() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {

        status.textContent =
            "Браузер не поддерживает звук";

        return false;
    }

    audioContext =
        new AudioContext();

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    return true;
}


/* ==================================================
   TONE
================================================== */

function playTone(duration) {

    return new Promise(
        function(resolve) {

            if (
                stopRequested ||
                !audioContext
            ) {

                resolve();

                return;
            }

            oscillator =
                audioContext
                    .createOscillator();

            const gain =
                audioContext
                    .createGain();

            oscillator.type =
                "sine";

            oscillator.frequency.value =
                Number(
                    pitchRange.value
                );

            gain.gain.value =
                0.15;

            oscillator.connect(
                gain
            );

            gain.connect(
                audioContext.destination
            );

            oscillator.start();

            setTimeout(
                function() {

                    if (oscillator) {

                        try {

                            oscillator.stop();

                        } catch (error) {}

                        oscillator =
                            null;
                    }

                    resolve();

                },
                duration
            );
        }
    );
}


/* ==================================================
   WAIT
================================================== */

function wait(ms) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


/* ==================================================
   STOP PLAYBACK
================================================== */

function stopPlayback() {

    stopRequested = true;

    isPlaying = false;

    if (oscillator) {

        try {

            oscillator.stop();

        } catch (error) {}

        oscillator = null;
    }

    if (audioContext) {

        try {

            audioContext.close();

        } catch (error) {}

        audioContext = null;
    }

    playButton.textContent =
        "▶";

    playButton.classList.remove(
        "playing"
    );

    statusLight.classList.remove(
        "active"
    );

    playStatus.textContent =
        "Готово к передаче";
}


    /* ==================================================
   GET MORSE FOR PLAYBACK
================================================== */

function getMorseForPlayback() {

    if (
        mode === "encode"
    ) {

        const morse =
            result.textContent.trim();

        if (
            !morse ||
            morse ===
            "Здесь появится результат"
        ) {

            return "";
        }

        return morse;
    }

    return input.value.trim();
}


/* ==================================================
   PLAY MORSE SOUND
================================================== */

async function playMorseSound(
    morseText
) {

    if (
        !morseText
    ) {

        status.textContent =
            "Сначала получи перевод";

        return;
    }


    if (
        !createAudio()
    ) {

        return;
    }


    stopRequested = false;

    isPlaying = true;


    playButton.textContent =
        "■";

    playButton.classList.add(
        "playing"
    );

    statusLight.classList.add(
        "active"
    );

    playStatus.textContent =
        "Передача...";

    status.textContent =
        "Воспроизведение...";


    /*
       Скорость:

       1×  = обычная
       2×  = в два раза быстрее
       0.5× = в два раза медленнее
    */

    const speed =
        Number(
            speedRange.value
        );


    const dot =
        100 / speed;


    /*
       Делим сообщение
       на слова через /
    */

    const words =
        morseText.split("/");


    for (
        let w = 0;
        w < words.length;
        w++
    ) {

        if (
            stopRequested
        ) {

            break;
        }


        const word =
            words[w].trim();


        if (!word) {

            continue;
        }


        /*
           Отдельные буквы
        */

        const letters =
            word.split(/\s+/);


        for (
            let l = 0;
            l < letters.length;
            l++
        ) {

            if (
                stopRequested
            ) {

                break;
            }


            const code =
                letters[l];


            /*
               Каждый символ:
               . = точка
               - = тире
            */

            for (
                let i = 0;
                i < code.length;
                i++
            ) {

                if (
                    stopRequested
                ) {

                    break;
                }


                const symbol =
                    code[i];


                if (
                    symbol === "."
                ) {

                    await playTone(
                        dot
                    );

                } else if (
                    symbol === "-"
                ) {

                    await playTone(
                        dot * 3
                    );
                }


                /*
                   Пауза между
                   элементами одной буквы
                */

                if (
                    i <
                        code.length - 1 &&
                    !stopRequested
                ) {

                    await wait(
                        dot
                    );
                }
            }


            /*
               Пауза между буквами
            */

            if (
                l <
                    letters.length - 1 &&
                !stopRequested
            ) {

                await wait(
                    dot * 3
                );
            }
        }


        /*
           Пауза между словами
        */

        if (
            w <
                words.length - 1 &&
            !stopRequested
        ) {

            await wait(
                dot * 7
            );
        }
    }


    const wasStopped =
        stopRequested;


    /*
       Останавливаем
       оставшийся генератор
    */

    if (oscillator) {

        try {

            oscillator.stop();

        } catch (error) {}

        oscillator = null;
    }


    /*
       Закрываем AudioContext
    */

    if (audioContext) {

        try {

            await audioContext.close();

        } catch (error) {}

        audioContext = null;
    }


    isPlaying = false;


    playButton.textContent =
        "▶";

    playButton.classList.remove(
        "playing"
    );

    statusLight.classList.remove(
        "active"
    );


    if (
        wasStopped
    ) {

        playStatus.textContent =
            "Передача остановлена";

        status.textContent =
            "Воспроизведение остановлено";

    } else {

        playStatus.textContent =
            "Передача завершена";

        status.textContent =
            "Воспроизведение завершено";
    }
}
