<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
    name="theme-color"
    content="#f5f5f5"
    id="themeColor"
>

<title>Neo Morse 0.7</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f0f1f3;

    color: #111;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}


.app {

    width: 100%;

    max-width: 720px;

    margin: 0 auto;

    padding:
        14px 12px 35px;
}


/* ==================================================
   DARK MODE
================================================== */

body.dark {

    background: #101112;

    color: #f1f1f1;
}

body.dark .card {

    background: #191b1d;

    border-color: #303236;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            0.25
        );
}

body.dark .subtitle,
body.dark .version,
body.dark .label,
body.dark .setting-value,
body.dark .play-status,
body.dark #status,
body.dark .footer {

    color: #9b9da1;
}

body.dark textarea,
body.dark select {

    background: #111315;

    color: #f1f1f1;

    border-color: #3a3c40;
}

body.dark button {

    background: #1d1f21;

    color: #f1f1f1;

    border-color: #3a3c40;
}

body.dark button:hover {

    background: #292b2e;
}

body.dark button.active,
body.dark button.primary {

    background: #f1f1f1;

    color: #111;

    border-color: #f1f1f1;
}

body.dark .result {

    background: #111315;

    color: #f1f1f1;
}

body.dark .table-wrapper {

    border-color: #35373a;
}

body.dark .morse-table {

    background: #191b1d;

    color: #f1f1f1;
}

body.dark .morse-table th {

    background: #25272a;
}

body.dark .morse-table th,
body.dark .morse-table td {

    border-color: #35373a;
}

body.dark .theme-button {

    background: #f1f1f1;

    color: #111;

    border-color: #f1f1f1;
}

body.dark .status-light {

    background: #555;
}

body.dark .status-light.active {

    background: #f1f1f1;
}


/* ==================================================
   HEADER
================================================== */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 14px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;
}

.logo {

    width: 43px;

    height: 43px;

    border-radius: 12px;

    background: #111;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    font-size: 17px;

    flex-shrink: 0;
}

body.dark .logo {

    background: #f1f1f1;

    color: #111;
}

h1 {

    margin: 0;

    font-size: 24px;

    line-height: 1.1;
}

.version {

    margin-top: 4px;

    color: #777;

    font-size: 12px;
}

.header-actions {

    display: flex;

    align-items: center;

    gap: 8px;
}

.theme-button {

    width: 42px;

    height: 42px;

    padding: 0;

    margin: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;
}

.status-light {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: #bbb;
}

.status-light.active {

    background: #111;
}


/* ==================================================
   CARD
================================================== */

.card {

    background: white;

    border:
        1px solid #ddd;

    border-radius: 17px;

    padding: 16px;

    margin-bottom: 12px;

    box-shadow:
        0 3px 12px
        rgba(
            0,
            0,
            0,
            0.04
        );
}


/* ==================================================
   LABEL
================================================== */

.label {

    font-size: 12px;

    font-weight: bold;

    color: #666;

    margin-bottom: 9px;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}


/* ==================================================
   SELECT
================================================== */

select {

    width: 100%;

    padding: 13px;

    border:
        1px solid #ccc;

    border-radius: 12px;

    background: white;

    color: #111;

    font-size: 16px;

    outline: none;
}

select:focus {

    border-color: #777;
}


/* ==================================================
   BUTTONS
================================================== */

button {

    padding: 12px 14px;

    margin: 0;

    border:
        1px solid #ccc;

    border-radius: 12px;

    background: white;

    color: #111;

    font-size: 15px;

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.1s ease;

    -webkit-tap-highlight-color:
        transparent;
}

button:hover {

    background: #eee;
}

button:active {

    transform:
        scale(0.98);
}

button.active {

    background: #111;

    color: white;

    border-color: #111;
}

button.primary {

    background: #111;

    color: white;

    border-color: #111;
}


/* ==================================================
   MODE
================================================== */

.mode-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}


/* ==================================================
   TEXTAREA
================================================== */

textarea {

    display: block;

    width: 100%;

    min-height: 140px;

    resize: vertical;

    padding: 13px;

    border:
        1px solid #ccc;

    border-radius: 13px;

    background: white;

    color: #111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 18px;

    line-height: 1.45;

    outline: none;
}

textarea:focus {

    border-color: #777;
}


/* ==================================================
   ACTIONS
================================================== */

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 9px;
}


/* ==================================================
   RESULT
================================================== */

.result {

    min-height: 85px;

    padding: 14px;

    border-radius: 13px;

    background: #eceef0;

    color: #111;

    font-size: 19px;

    line-height: 1.5;

    white-space: pre-wrap;

    word-break: break-word;
}

.result.morse {

    font-family:
        "Courier New",
        monospace;

    letter-spacing: 2px;
}


/* ==================================================
   PLAYBACK
================================================== */

.playback {

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}

.play-button {

    width: 78px;

    height: 78px;

    padding: 0;

    border-radius: 50%;

    background: #111;

    color: white;

    border:
        1px solid #111;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    margin: 4px 0 9px;
}

.play-button:hover {

    background: #222;
}

.play-button.playing {

    background: #555;
}

.play-status {

    min-height: 18px;

    color: #777;

    font-size: 13px;
}


/* ==================================================
   SETTINGS
================================================== */

.setting {

    margin-bottom: 17px;
}

.setting:last-child {

    margin-bottom: 0;
}

.setting-title {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: bold;
}

.setting-value {

    color: #777;

    font-weight: normal;
}

input[type="range"] {

    width: 100%;

    accent-color: #111;

    cursor: pointer;
}


/* ==================================================
   TABLE
================================================== */

.table-wrapper {

    overflow-x: auto;

    border:
        1px solid #ddd;

    border-radius: 12px;
}

.morse-table {

    width: 100%;

    border-collapse:
        collapse;

    background: white;
}

.morse-table th,
.morse-table td {

    padding: 9px;

    text-align: center;

    border-bottom:
        1px solid #ddd;
}

.morse-table th {

    background: #f0f0f0;

    font-size: 13px;
}

.morse-table td {

    font-size: 15px;
}

.morse-code {

    font-family:
        "Courier New",
        monospace;

    font-size: 17px !important;

    letter-spacing: 2px;
}


/* ==================================================
   STATUS
================================================== */

#status {

    min-height: 18px;

    margin-top: 9px;

    text-align: center;

    color: #666;

    font-size: 13px;
}


/* ==================================================
   FOOTER
================================================== */

.footer {

    padding-top: 5px;

    text-align: center;

    color: #888;

    font-size: 12px;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 520px) {

    .app {

        padding:
            11px 9px 28px;
    }

    .card {

        padding: 14px;

        border-radius: 16px;
    }

    h1 {

        font-size: 22px;
    }

    textarea {

        min-height: 125px;

        font-size: 17px;
    }

    .result {

        font-size: 18px;
    }

    .play-button {

        width: 72px;

        height: 72px;
    }
}


/* ==================================================
   SMALL MOBILE
================================================== */

@media (max-width: 360px) {

    .mode-buttons,
    .actions {

        grid-template-columns:
            1fr;
    }

    .header-actions {

        gap: 5px;
    }

    .theme-button {

        width: 38px;

        height: 38px;
    }
}

</style>

</head>

        <button

            Очистить
        </button>

    </div>

</div>


<!-- ==================================================
     RESULT
================================================== -->

<div class="card">

    <div
        class="label"

        Азбука Морзе
    </div>

    <div
        id="result"

        Здесь появится результат
    </div>

    <div class="actions">

        <button
            id="copyButton"
        >
            Копировать
        </button>

        <button
            id="useResultButton"
        >
            Использовать
        </button>

    </div>

</div>


<!-- ==================================================
     PLAYBACK
================================================== -->

<div class="card">

    <div class="label">
        Воспроизведение
    </div>

    <div class="playback">

        <button
            id="playButton"
            class="play-button"

        <div
            id="playStatus"
            class="play-status"
        >
            Готово к воспроизведению

    </div>

</div>


<!-- ==================================================
     SOUND SETTINGS
================================================== -->

<div class="card">

    <div class="label">
        Настройки звука

    <div class="setting">

        <div class="setting-title">

            <span>
                Скорость

            <span
                id="speedValue"

                1×
            </span>

        </div>

        <input
            type="range"
            id="speedRange"

            max="3"
            step="0.25"
            value="1"

    </div>


    <div class="setting">

            <span>
                Тональность

        <input
            type="range"

            step="50"

function getCurrentMorse() {

    return LANGUAGES[
        language
    ];

/* ==================================================
   REVERSE MORSE
================================================== */

function createReverseMorse(
    morse
) {

    const reverse = {};

    for (
        const symbol in morse
    ) {

        const code =
            morse[symbol];

        if (
            reverse[code] ===
            undefined
        ) {

            reverse[code] =
                symbol;
        }
    }

    return reverse;
}


/* ==================================================
   TEXT NORMALIZATION
================================================== */

function normalizeText(
    text
) {

    return text
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toUpperCase();
}


/* ==================================================
   TEXT → MORSE
================================================== */

function textToMorse(
    text
) {

    const morse =
        getCurrentMorse();

    const original =
        text.toUpperCase();

    const output = [];

    for (
        let i = 0;
        i < original.length;
        i++
    ) {

        const character =
            original[i];

        if (
            character === " "
        ) {

            output.push(
                "/"
            );

            continue;
        }

        if (
            morse[character]
        ) {

            output.push(
                morse[character]
            );

            continue;
        }

        const normalized =
            normalizeText(
                character
            );

        if (
            morse[normalized]
        ) {

            output.push(
                morse[normalized]
            );
        }
    }

    return output.join(
        " "
    );
}


/* ==================================================
   MORSE → TEXT
================================================== */

function morseToText(
    text
) {

    const reverse =
        createReverseMorse(
            getCurrentMorse()
        );

    text =
        text.trim();

    if (
        text === ""
    ) {

        return "";
    }

    const words =
        text.split(
            "/"
        );

    const output = [];

    for (
        let w = 0;
        w < words.length;
        w++
    ) {

        const word =
            words[w].trim();

        if (
            word === ""
        ) {

            continue;
        }

        const letters =
            word.split(
                /\s+/
            );

        let decoded =
            "";

        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            const code =
                letters[i];

            if (
                reverse[code]
            ) {

                decoded +=
                    reverse[code];

            } else {

                decoded +=
                    "?";
            }
        }

        output.push(
            decoded
        );
    }

    return output.join(
        " "
    );
}


/* ==================================================

================================================== */

function translate() {

    stopPlayback();

    const text =
        input.value;

    if (
        text.trim() ===
        ""
    ) {

        result.textContent =
            "Здесь появится результат";

        status.textContent =
            "";

        return;
    }

    let translated =
        "";

    if (
        mode ===
        "encode"
    ) {

        translated =
            textToMorse(
                text
            );

        result.classList.add(
            "morse"
        );

        resultLabel.textContent =
            "Азбука Морзе";

    } else {

        translated =
            morseToText(
                text
            );

        result.classList.remove(
            "morse"
        );

        resultLabel.textContent =
            "Текст";
    }

    if (
        translated ===
        ""
    ) {

        result.textContent =
            "Не удалось выполнить перевод";

        status.textContent =
            "Проверь введённые данные";

        return;
    }

    result.textContent =
        translated;

    status.textContent =
        "Готово";
}

/* ==================================================
   AUDIO SUPPORT
================================================== */

function getAudioContextClass() {

    return (
        window.AudioContext ||
        window.webkitAudioContext
    );
}


/* ==================================================
   CREATE AUDIO CONTEXT
================================================== */

function createAudio() {

    const AudioContextClass =
        getAudioContextClass();

    if (
        !AudioContextClass
    ) {

        status.textContent =
            "Этот браузер не поддерживает воспроизведение звука";

        return false;
    }

    try {

        audioContext =
            new AudioContextClass();

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

        return true;

    } catch (
        error
    ) {

        status.textContent =
            "Не удалось запустить звук";

        return false;
    }
}


/* ==================================================
   WAIT
================================================== */

function wait(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );
        }
    );
}


/* ==================================================
   PLAY TONE
================================================== */

function playTone(
    duration
) {

    return new Promise(
        function(resolve) {

            if (
                stopRequested ||
                !audioContext
            ) {

                resolve();

                return;
            }

            oscillator =
                audioContext
                    .createOscillator();

            const gain =
                audioContext
                    .createGain();

            oscillator.type =
                "sine";

            oscillator.frequency.value =
                Number(
                    pitchRange.value
                );

            gain.gain.value =
                0.15;

            oscillator.connect(
                gain
            );

            gain.connect(
                audioContext.destination
            );

            oscillator.start();

            setTimeout(
                function() {

                    if (
                        oscillator
                    ) {

                        try {

                            oscillator.stop();

                        } catch (
                            error
                        ) {}

                        oscillator =
                            null;
                    }

                    resolve();

                },
                duration
            );
        }
    );
        }


    /* ==================================================
   GET MORSE FOR PLAYBACK
================================================== */

function getMorseForPlayback() {

    let morse = "";

    if (
        mode === "encode"
    ) {

        morse =
            result.textContent.trim();

    } else {

        morse =
            textToMorse(
                input.value
            );
    }

    if (
        !morse ||
        morse ===
        "Здесь появится результат"
    ) {

        return "";
    }

    return morse;
}


/* ==================================================
   STOP PLAYBACK
================================================== */

function stopPlayback() {

    stopRequested =
        true;

    isPlaying =
        false;

    if (
        oscillator
    ) {

        try {

            oscillator.stop();

        } catch (
            error
        ) {}

        oscillator =
            null;
    }

    if (
        audioContext
    ) {

        try {

            audioContext.close();

        } catch (
            error
        ) {}

        audioContext =
            null;
    }

    playButton.textContent =
        "▶";

    playButton.classList.remove(
        "playing"
    );

    statusLight.classList.remove(
        "active"
    );

    playStatus.textContent =
        "Готово к воспроизведению";
}


/* ==================================================
   PLAY MORSE SOUND
================================================== */

async function playMorseSound(
    morseText
) {

    if (
        !morseText
    ) {

        status.textContent =
            "Нечего воспроизводить";

        return;
    }

    if (
        !createAudio()
    ) {

        return;
    }

    stopRequested =
        false;

    isPlaying =
        true;

    playButton.textContent =
        "■";

    playButton.classList.add(
        "playing"
    );

    statusLight.classList.add(
        "active"
    );

    playStatus.textContent =
        "Воспроизведение...";

    status.textContent =
        "Воспроизведение...";


    const speed =
        Number(
            speedRange.value
        );

    const dot =
        100 / speed;


    const words =
        morseText.split(
            "/"
        );


    for (
        let wordIndex = 0;
        wordIndex < words.length;
        wordIndex++
    ) {

        if (
            stopRequested
        ) {

            break;
        }

        const word =
            words[
                wordIndex
            ].trim();

        if (
            word === ""
        ) {

            continue;
        }

        const letters =
            word.split(
                /\s+/
            );


        for (
            let letterIndex = 0;
            letterIndex < letters.length;
            letterIndex++
        ) {

            if (
                stopRequested
            ) {

                break;
            }

            const code =
                letters[
                    letterIndex
                ];


            for (
                let symbolIndex = 0;
                symbolIndex < code.length;
                symbolIndex++
            ) {

                if (
                    stopRequested
                ) {

                    break;
                }

                const symbol =
                    code[
                        symbolIndex
                    ];


                if (
                    symbol === "."
                ) {

                    await playTone(
                        dot
                    );

                } else if (
                    symbol === "-"
                ) {

                    await playTone(
                        dot * 3
                    );
                }


                if (
                    symbolIndex <
                        code.length - 1 &&
                    !stopRequested
                ) {

                    await wait(
                        dot
                    );
                }
            }


            if (
                letterIndex <
                    letters.length - 1 &&
                !stopRequested
            ) {

                await wait(
                    dot * 3
                );
            }
        }


        if (
            wordIndex <
                words.length - 1 &&
            !stopRequested
        ) {

            await wait(
                dot * 7
            );
        }
    }


    const wasStopped =
        stopRequested;


    if (
        oscillator
    ) {

        try {

            oscillator.stop();

        } catch (
            error
        ) {}

        oscillator =
            null;
    }


    if (
        audioContext
    ) {

        try {

            await audioContext.close();

        } catch (
            error
        ) {}

        audioContext =
            null;
    }


    isPlaying =
        false;

    playButton.textContent =
        "▶";

    playButton.classList.remove(
        "playing"
    );

    statusLight.classList.remove(
        "active"
    );


    if (
        wasStopped
    ) {

        playStatus.textContent =
            "Воспроизведение остановлено";

        status.textContent =
            "Остановлено";

    } else {

        playStatus.textContent =
            "Воспроизведение завершено";

        status.textContent =
            "Готово";
    }
}

playButton.addEventListener(

        */

        if (

        ) {

            getMorseForPlayback();


        if (
            !morse
        ) {

            status.textContent =
                "Нечего воспроизводить";

            return;
        }


        playMorseSound(
            morse
        );
    }
);

    function(event) {

        /*
           Пробел запускает /
           останавливает звук,
           если пользователь

            event.code !==
            "Space"
        ) {

            return;

        if (
            document.activeElement ===
            input
        ) {

            return;

        event.preventDefault();

        if (
            isPlaying

            stopPlayback();

        } else {

            const morse =
                getMorseForPlayback();

            if (
                morse
            ) {

                playMorseSound(

        }
    }
);

    document.getElementById(
        "sortTableButton"

    sortTableButton

    let reversed =
        false;

    sortTableButton.addEventListener(
        "click",
        function() {

            const rows =
                Array.from(
                    tableBody.querySelectorAll(
                        "tr"
                    )
                );


            rows.sort(
                function(a, b) {

                    const aText =
                        a.children[0]
                            .textContent;

                    const bText =
                        b.children[0]
                            .textContent;

                    return reversed
                        ? bText.localeCompare(
                            aText
                        )
                        : aText.localeCompare(
                            bText
                        );
                }
            );


            reversed =
                !reversed;


            rows.forEach(
                function(row) {

                    tableBody.appendChild(
                        row
                    );
                }
            );
        }
    );
}

    function() {

        stopPlayback();
    }
);


/* ==================================================
   PREVENT AUDIO DUPLICATION
================================================== */

let playbackToken =
    0;


async function safePlayMorse(
    morse
) {

    playbackToken++;

    const currentToken =
        playbackToken;


    if (
        isPlaying
    ) {

        stopPlayback();
    }


    if (
        !morse
    ) {

        return;
    }


    await playMorseSound(
        morse
    );


    /*
       Если за время воспроизведения
       пользователь уже нажал кнопку
       повторно, старый процесс
       больше ничего не запускает.
    */

    if (
        currentToken !==
        playbackToken
    ) {

        return;
    }
}


/* ==================================================
   FINAL PLAY BUTTON LOGIC
================================================== */

playButton.onclick =
    function() {

        vibrateShort();


        /*
           Второе нажатие во время
           воспроизведения = STOP.
        */

        if (
            isPlaying
        ) {

            playbackToken++;

            stopPlayback();

            setStatus(
                "Воспроизведение остановлено"
            );

            return;
        }


        const morse =
            getMorseForPlayback();


        if (
            !morse
        ) {

            setStatus(
                "Нечего воспроизводить"
            );

            return;
        }


        safePlayMorse(
            morse
        );
    };


/* ==================================================
   CLEAN AUDIO AFTER STOP
================================================== */

function hardStopAudio() {

    stopRequested =
        true;

    if (
        oscillator
    ) {

        try {

            oscillator.stop();

        } catch (
            error
        ) {}

        oscillator =
            null;
    }


    if (
        audioContext
    ) {

        try {

            audioContext.close();

        } catch (
            error
        ) {}

        audioContext =
            null;
    }


    isPlaying =
        false;

    if (
        playButton
    ) {

        playButton.textContent =
            "▶";

        playButton.classList.remove(
            "playing"
        );
    }


    if (
        statusLight
    ) {

        statusLight.classList.remove(
            "active"
        );
    }
}


/* ==================================================
   EMERGENCY STOP
================================================== */

const emergencyStopButton =
    document.getElementById(
        "emergencyStopButton"
    );


if (
    emergencyStopButton
) {

    emergencyStopButton.addEventListener(
        "click",
        function() {

            playbackToken++;

            hardStopAudio();

            setStatus(
                "Звук остановлен"
            );

            vibrateShort();
        }
    );
}


/* ==================================================
   DOUBLE CLICK PROTECTION
================================================== */

let lastPlayClick =
    0;


playButton.addEventListener(
    "dblclick",
    function(event) {

        /*
           Не запускаем два
           воспроизведения подряд.
        */

        event.preventDefault();
    }
);


/* ==================================================
   RESPONSIVE VIEWPORT CHECK
================================================== */

function updateMobileMode() {

    const isMobile =
        window.innerWidth <=
        700;


    document.body.classList.toggle(
        "mobile",
        isMobile
    );
}


window.addEventListener(
    "resize",
    updateMobileMode
);


updateMobileMode();


/* ==================================================
   ORIENTATION CHANGE
================================================== */

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            updateMobileMode,
            100
        );
    }
);


/* ==================================================
   PERSIST INPUT
================================================== */

const rememberInput =
    document.getElementById(
        "rememberInput"
    );


if (
    rememberInput
) {

    rememberInput.checked =
        localStorage.getItem(
            "neoMorseRememberInput"
        ) ===
        "true";


    rememberInput.addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "neoMorseRememberInput",
                rememberInput.checked
            );


            if (
                !rememberInput.checked
            ) {

                localStorage.removeItem(
                    "neoMorseInput"
                );
            }
        }
    );
}


/* ==================================================
   SAVE INPUT
================================================== */

input.addEventListener(
    "input",
    function() {

        if (
            rememberInput &&
            rememberInput.checked
        ) {

            localStorage.setItem(
                "neoMorseInput",
                input.value
            );
        }
    }
);


/* ==================================================
   LOAD INPUT
================================================== */

if (
    rememberInput &&
    rememberInput.checked
) {

    const savedInput =
        localStorage.getItem(
            "neoMorseInput"
        );


    if (
        savedInput
    ) {

        input.value =
            savedInput;
    }
}


/* ==================================================
   ENTER TO TRANSLATE
================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter" &&
            event.shiftKey
        ) {

            event.preventDefault();

            translate();
        }
    }
);


/* ==================================================
   ESC TO STOP
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            if (
                isPlaying
            ) {

                playbackToken++;

                stopPlayback();

                setStatus(
                    "Воспроизведение остановлено"
                );
            }
        }
    }
);


/* ==================================================
   FINAL TABLE REFRESH
================================================== */

function refreshEverything() {

    updateMorseTable();

    updateLanguageDescription();

    updateCharacterCounter();

    updateResultCounter();

    updateConnectionStatus();

    updateMobileMode();
}


refreshEverything();


/* ==================================================
   FINAL APP READY
================================================== */

document.body.classList.add(
    "app-ready"
);


if (
    status
) {

    status.textContent =
        "";
}

   NEO MORSE 0.7
   END OF JAVASCRIPT
================================================== */

</script>
